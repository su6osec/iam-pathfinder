name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples docs
      - name: Test
        run: pytest -q

  example:
    name: analyze the bundled example in every format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Render every format
        run: |
          set -e
          for fmt in table json markdown sarif mermaid html; do
            iam-pathfinder analyze examples/vulnerable-account.json --format "$fmt" --out "report.$fmt"
          done
          iam-pathfinder explain FULL_ADMIN > /dev/null
          iam-pathfinder rules --format json > rules.json
          python -c "import json; assert len(json.load(open('rules.json'))) == 23"
          python -c "import json; d=json.load(open('report.json')); assert d['summary']['findings'] >= 20"
      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: report.html
