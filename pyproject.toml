[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-pathfinder"
dynamic = ["version"]
description = "Offline AWS IAM privilege-escalation and risky-permission analyzer (no AWS API calls)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["aws", "iam", "security", "privilege-escalation", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
iam-pathfinder = "iam_pathfinder.cli:main"

[project.urls]
Homepage = "https://github.com/example/iam-pathfinder"
Documentation = "https://github.com/example/iam-pathfinder#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "iam_pathfinder.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative API requires calls (typer.Argument/typer.Option) in
# parameter defaults; that is the documented pattern.
"src/iam_pathfinder/cli.py" = ["B008"]
